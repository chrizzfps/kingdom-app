<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/Isotipo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KINGDOM AGENCY | PROPUESTAS</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #000000;
      --primary: #000000;
    }

    .dark {
      --bg: #09090b;
      --fg: #ffffff;
      --primary: #ffffff;
    }

    body {
      margin: 0;
      background-color: var(--bg);
      transition: background-color 0.3s ease;
    }

    #preloader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .preloader-isotype {
      width: 80px;
      height: 80px;
      fill: var(--fg);
      animation: heartbeat 2s ease-in-out infinite;
    }

    @keyframes heartbeat {

      0%,
      100% {
        transform: scale(1);
        opacity: 0.8;
      }

      50% {
        transform: scale(1.1);
        opacity: 1;
      }
    }

    .loader-bar {
      width: 120px;
      height: 2px;
      background: rgba(128, 128, 128, 0.1);
      position: relative;
      overflow: hidden;
      border-radius: 10px;
    }

    .loader-bar::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 50%;
      height: 100%;
      background: var(--fg);
      animation: loading 1.5s infinite ease-in-out;
    }

    @keyframes loading {
      0% {
        left: -50%;
        width: 30%;
      }

      50% {
        width: 50%;
      }

      100% {
        left: 100%;
        width: 30%;
      }
    }

    /* Hide loader when app is ready */
    .app-ready #preloader {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }
  </style>
  <script>
    (function () {
      const storageKey = "vite-ui-theme";
      const storedTheme = localStorage.getItem(storageKey);
      const systemTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      const theme = storedTheme === "system" || !storedTheme ? systemTheme : storedTheme;
      document.documentElement.classList.add(theme);
    })();
  </script>
</head>
